<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="icon" href="../Imagens/ST.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../Css's/signin.css">
    <title>Simple-Tax | Login</title>
</head>

    <body>

        <div class="container">
            <div class="form-container sign-in">
                <form>
                    <!---action="calcular.html" method="get"-->
                    <h1>Entrar</h1><br>

                    
                    <input type="text" id="username" name="username" autocomplete="username" placeholder="Username" required>
                    <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Senha" required>
                    
                    <button id="entrar">Entrar</button>
                    <button id="teste">teste</button>
                    
                    <a href="signup.html">Não tem conta? Cadastrar-se</a>
                </form>
                <div id="st-image">
                    <img src="../Imagens/ST-Transparente.png" alt="">
                </div>
                
            </div>
        </div>
        <script src="../JS/login.js"></script>
    </body>
</html>
